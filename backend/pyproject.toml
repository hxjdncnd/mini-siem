[project]
name = "mini-siem"
version = "0.1.0"
description = "A small security information and event management platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in argument defaults is the framework's idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # literal log lines
"../simulator/*" = ["E501", "UP017"]  # literal log lines; stays runnable on older Pythons
