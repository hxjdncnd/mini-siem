name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minisiem_test
          POSTGRES_USER: minisiem
          POSTGRES_PASSWORD: minisiem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minisiem" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../simulator && ruff format --check . ../simulator
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          MINISIEM_TEST_DATABASE_URL: postgresql+psycopg://minisiem:minisiem@localhost:5432/minisiem_test
