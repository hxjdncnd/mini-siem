name: Demo

# Publishes the dashboard as a static demo on GitHub Pages. It has no backend: it replays a recorded
# simulator run in the browser (frontend/src/demo). Enable it once under Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
